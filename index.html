<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>aqua-pics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; background: #000; color: #eee; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; touch-action: none; }
  #hint {
    position: fixed; top: env(safe-area-inset-top, 12px); left: 0; right: 0;
    text-align: center; font-size: 14px; padding: 10px;
    color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none;
    transition: opacity 0.5s;
  }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 16px calc(env(safe-area-inset-bottom, 12px) + 10px);
    background: linear-gradient(transparent, rgba(0,0,0,0.75) 30%);
    display: flex; flex-direction: column; gap: 8px;
  }
  #sliders, #camCtl, #presets, #more { display: flex; flex-direction: column; gap: 8px; }
  .collapsed { display: none !important; }
  #camCtl { max-height: 40vh; overflow-y: auto; }
  #camCtl .row label { width: 92px; }
  #camCtl select {
    flex: 1; background: rgba(255,255,255,0.14); color: #eee;
    border: none; border-radius: 6px; padding: 6px;
  }
  #presets button, #more button { flex: 1; }
  .buttons button.active { background: rgba(255,144,64,0.45); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row label { font-size: 12px; width: 62px; color: #bbb; flex-shrink: 0; }
  input[type=range] { flex: 1; accent-color: #ff9040; }
  .buttons { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; gap: 6px; }
  .buttons button { padding: 10px 8px; min-width: 0; }
  button {
    background: rgba(255,255,255,0.14); color: #eee; border: none;
    border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600;
  }
  button:active { background: rgba(255,255,255,0.3); }
  #shutter {
    width: 66px; height: 66px; border-radius: 50%;
    flex: 0 0 66px;
    background: #fff; border: 4px solid rgba(255,255,255,0.4);
    background-clip: content-box; padding: 3px;
  }
  #shutter:active { background-color: #ccc; }
  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: #05121f; z-index: 10; padding: 24px; text-align: center;
  }
  #start h1 { font-size: 22px; }
  #start p { color: #9ab; font-size: 14px; max-width: 320px; line-height: 1.5; }
  #start button { background: #1a6fb0; padding: 14px 28px; font-size: 17px; border-radius: 12px; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  #res {
    position: fixed; top: env(safe-area-inset-top, 8px); right: 8px;
    font-size: 11px; color: rgba(255,255,255,0.55); text-shadow: 0 1px 2px #000;
    pointer-events: none;
  }
  #err { color: #f88; font-size: 13px; max-width: 320px; }
</style>
</head>
<body>

<div id="start">
  <h1>🐠 aqua-pics</h1>
  <p>De-blue your reef tank photos, live. Allow camera access, then tap something in the tank that should be white or gray (sand, a rock, a frag plug) to white-balance.</p>
  <button id="startBtn">Start camera</button>
  <div id="err"></div>
</div>

<div id="stage"><canvas id="cv"></canvas></div>
<div id="hint">Tap something white/gray in the tank to color-correct</div>
<div id="res"></div>

<div id="panel" hidden>
  <div id="sliders">
    <div class="row"><label>Tone</label><input type="range" id="tone" min="0" max="100" value="35"></div>
    <div class="row"><label>Red boost</label><input type="range" id="red" min="100" max="500" value="100"></div>
    <div class="row"><label>Blue cut</label><input type="range" id="blue" min="20" max="100" value="100"></div>
    <div class="row"><label>Tint</label><input type="range" id="tintGM" min="-100" max="100" value="0"></div>
    <div class="row"><label>Fluor keep</label><input type="range" id="fluor" min="0" max="100" value="50"></div>
    <div class="row"><label>Clarity</label><input type="range" id="clarity" min="0" max="100" value="25"></div>
    <div class="row"><label>Denoise</label><input type="range" id="denoise" min="0" max="100" value="60"></div>
    <div class="row"><label>Strength</label><input type="range" id="strength" min="0" max="100" value="100"></div>
    <div class="row"><label>Exposure</label><input type="range" id="exposure" min="-100" max="100" value="0"></div>
    <div class="row"><label>Saturation</label><input type="range" id="saturation" min="0" max="200" value="100"></div>
  </div>
  <div id="camCtl" class="collapsed"></div>
  <div id="presets" class="collapsed">
    <div class="row" style="font-size:11px;color:#9ab">What are you looking at? Picks the correction to match your eyes.</div>
    <div class="row">
      <button data-preset="windex">Windex tank</button>
      <button data-preset="actinic">Actinic only</button>
      <button data-preset="mixed">White+blue</button>
      <button data-preset="white">Mostly white</button>
    </div>
  </div>
  <div id="more" class="collapsed">
    <div class="row">
      <button id="reset">Reset</button>
      <button id="compare">Hold: original</button>
    </div>
  </div>
  <div class="buttons">
    <button id="tune">🎚</button>
    <button id="camBtn" hidden>📷</button>
    <button id="presetBtn">✨</button>
    <button id="shutter" aria-label="Take photo"></button>
    <button id="moreBtn">⋯</button>
  </div>
</div>

<div id="flash"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);

// Surface runtime errors on screen — no devtools on the phone.
window.addEventListener("error", e => {
  const el = $("err");
  el.textContent = "Error: " + e.message;
  $("start").hidden = false;
});

const VS = `
attribute vec2 p;
varying vec2 uv;
void main() { uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }
`;

// Color pipeline, in order: decode sRGB -> clarity (local contrast) ->
// white balance via Bradford chromatic adaptation (scale in cone-response
// space, not raw RGB, so strong corrections don't skew hues) -> tint toward
// target white point -> fluorescence protection -> exposure -> Hable filmic
// tone curve (soft toe + shoulder instead of hard clip) -> highlight
// desaturation -> re-encode.
const FS = `
precision highp float;
varying vec2 uv;
uniform sampler2D tex;
uniform vec3 lmsGains;
uniform vec3 waterDir;
uniform vec3 tint;
uniform float exposure;
uniform float saturation;
uniform float bypass;
uniform float fluorKeep;
uniform float zoom;
uniform float clarity;
uniform vec2 texel;

// Bradford cone response sandwich: sRGB-linear <-> LMS (columns!)
const mat3 RGB2LMS = mat3(
  0.4227253, 0.0556998, 0.0213826,
  0.4913453, 0.9615341, 0.0876419,
  0.0273579, 0.0231838, 0.9805081);
const mat3 LMS2RGB = mat3(
  2.5380445, -0.1460041, -0.0422985,
 -1.2932770,  1.1166483, -0.0716072,
 -0.0402369, -0.0223290,  1.0227527);

vec3 hable(vec3 x) {
  const float A = 0.15, B = 0.50, C = 0.10, D = 0.20, E = 0.02, F = 0.30;
  return ((x * (A * x + C * B) + D * E) / (x * (A * x + B) + D * F)) - E / F;
}

void main() {
  vec2 zuv = (uv - 0.5) / zoom + 0.5;
  vec3 c = texture2D(tex, zuv).rgb;
  vec3 lin = pow(c, vec3(2.2));
  const vec3 LW = vec3(0.2126, 0.7152, 0.0722);

  // Clarity: unsharp mask on luma (gamma-space estimate is fine here).
  vec2 o = texel * 2.0;
  float bl = dot(texture2D(tex, zuv + vec2( o.x, 0.0)).rgb, LW)
           + dot(texture2D(tex, zuv + vec2(-o.x, 0.0)).rgb, LW)
           + dot(texture2D(tex, zuv + vec2(0.0,  o.y)).rgb, LW)
           + dot(texture2D(tex, zuv + vec2(0.0, -o.y)).rgb, LW)
           + dot(texture2D(tex, zuv + vec2( o.x,  o.y)).rgb, LW)
           + dot(texture2D(tex, zuv + vec2(-o.x,  o.y)).rgb, LW)
           + dot(texture2D(tex, zuv + vec2( o.x, -o.y)).rgb, LW)
           + dot(texture2D(tex, zuv + vec2(-o.x, -o.y)).rgb, LW);
  lin *= max(1.0 + clarity * (dot(c, LW) - bl / 8.0) * 3.0, 0.0);

  // White balance in LMS, then re-aim at the chosen white point.
  vec3 corrected = max(LMS2RGB * ((RGB2LMS * lin) * lmsGains), 0.0) * tint;

  // Fluorescence protection: pixels colored like the water cast get full
  // correction; pixels glowing in their own color keep it.
  float sim = dot(normalize(lin + vec3(1e-4)), waterDir);
  float protect = (1.0 - smoothstep(0.86, 0.99, sim)) * fluorKeep;
  lin = mix(corrected, lin, protect) * exposure;

  // Hable filmic curve, normalized to its value at white point 11.2.
  lin = hable(lin * 2.0) / hable(vec3(11.2));

  float luma = dot(lin, LW);
  // Ease saturation toward neutral in highlights so bright areas stay clean.
  float satEff = mix(saturation, min(saturation, 1.0), smoothstep(0.6, 1.0, luma));
  lin = mix(vec3(luma), lin, satEff);
  vec3 outc = pow(clamp(lin, 0.0, 1.0), vec3(1.0 / 2.2));
  gl_FragColor = vec4(mix(outc, c, bypass), 1.0);
}
`;

// Temporal denoise: blend each camera frame into a running average
// (exponential moving average) before color correction. Static scene
// converges to clean pixels; per-frame sensor noise cancels out.
const FS_BLEND = `
precision highp float;
varying vec2 uv;
uniform sampler2D cam;
uniform sampler2D prev;
uniform float alpha;
uniform vec2 shift; // camera drift since last frame, in UV units
void main() {
  vec2 puv = uv + shift;
  // If the aligned sample falls outside the average, take the camera as-is.
  float inside = step(0.0, puv.x) * step(puv.x, 1.0) * step(0.0, puv.y) * step(puv.y, 1.0);
  float a = mix(1.0, alpha, inside);
  gl_FragColor = vec4(mix(texture2D(prev, puv).rgb, texture2D(cam, uv).rgb, a), 1.0);
}
`;

// iOS Safari won't decode frames from a video element that isn't in the DOM,
// so keep it attached but invisible (display:none also stops decoding).
const video = document.createElement("video");
video.setAttribute("playsinline", "");
video.setAttribute("webkit-playsinline", "");
video.setAttribute("muted", "");
video.setAttribute("autoplay", "");
video.muted = true;
video.style.cssText = "position:fixed;top:0;left:0;width:2px;height:2px;opacity:0.01;pointer-events:none;";
document.body.appendChild(video);

const cv = $("cv");
const gl = cv.getContext("webgl");
let prog, uLmsGains, uWaterDir, uExposure, uSaturation, uBypass, uFluor, uTint, uZoom, uClarity, uTexel;

// Bradford: same matrix as the shader, row-major here.
const RGB2LMS = [
  [0.4227253, 0.4913453, 0.0273579],
  [0.0556998, 0.9615341, 0.0231838],
  [0.0213826, 0.0876419, 0.9805081],
];
const mulM = (M, v) => M.map(r => r[0] * v[0] + r[1] * v[1] + r[2] * v[2]);
let camTrack = null, camZoomCaps = null; // native (ISP) zoom if the browser exposes it
let digitalZoom = 1;
let blendProg, uAlpha, uCam, uPrev, uShift, uTex;
let camTex, pingPong = [], pp = 0, firstFrame = true;

// Offscreen 2D canvas used only to sample pixels for tap-to-white-balance.
const sampleCv = document.createElement("canvas");
const sampleCtx = sampleCv.getContext("2d", { willReadFrequently: true });

// --- shift registration (handheld stabilization for the denoiser) -----------
// Estimate global camera drift between consecutive frames on a tiny grayscale
// thumbnail, so the blend pass can align the running average to the new frame.
// Astrophotography "lucky imaging", pocket edition: integer-pixel search on a
// 64x48 luma image (±3px ~ ±60px at full res), refined by parabolic fit.
const MW = 64, MH = 48;
const motionCv = document.createElement("canvas");
motionCv.width = MW; motionCv.height = MH;
const motionCtx = motionCv.getContext("2d", { willReadFrequently: true });
let prevLuma = null;

function lumaThumb() {
  motionCtx.drawImage(video, 0, 0, MW, MH);
  const d = motionCtx.getImageData(0, 0, MW, MH).data;
  const out = new Float32Array(MW * MH);
  for (let i = 0; i < out.length; i++) {
    out[i] = d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114;
  }
  return out;
}

function sad(a, b, dx, dy) { // sum of absolute differences at integer offset
  let s = 0, n = 0;
  const M = 4; // margin
  for (let y = M; y < MH - M; y += 2) {
    for (let x = M; x < MW - M; x += 2) {
      const j = (y + dy) * MW + (x + dx);
      s += Math.abs(a[y * MW + x] - b[j]);
      n++;
    }
  }
  return s / n;
}

function estimateShift() { // returns [dx, dy] in thumbnail pixels, or null
  const cur = lumaThumb();
  if (!prevLuma) { prevLuma = cur; return null; }
  const R = 3;
  let best = Infinity, bx = 0, by = 0;
  const costs = {};
  for (let dy = -R; dy <= R; dy++) {
    for (let dx = -R; dx <= R; dx++) {
      const c = sad(cur, prevLuma, dx, dy);
      costs[dx + "," + dy] = c;
      if (c < best) { best = c; bx = dx; by = dy; }
    }
  }
  prevLuma = cur;
  if (Math.abs(bx) === R || Math.abs(by) === R) return null; // hit the edge: motion too big, don't trust
  // Sub-pixel refinement: parabolic fit through the cost neighborhood.
  const cN = costs[bx + "," + (by - 1)], cS = costs[bx + "," + (by + 1)];
  const cW = costs[(bx - 1) + "," + by], cE = costs[(bx + 1) + "," + by];
  const c0 = costs[bx + "," + by];
  const fx = (cW - cE) / (2 * (cW - 2 * c0 + cE) || 1);
  const fy = (cN - cS) / (2 * (cN - 2 * c0 + cS) || 1);
  return [bx + (isFinite(fx) ? fx : 0), by + (isFinite(fy) ? fy : 0)];
}

let wbGains = [1, 1, 1];   // computed from tap or preset, before strength lerp
let comparing = false;

function makeTexture() {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

let accumType; // half-float if available: avoids crushing dark tones in the average

function makeAccumTarget(w, h) {
  const tex = makeTexture();
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, accumType, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return ok ? { tex, fbo } : null;
}

function initGL() {
  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(fsSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, VS));
    gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      throw new Error(gl.getProgramInfoLog(p));
    return p;
  }
  prog = program(FS);
  blendProg = program(FS_BLEND);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  for (const p of [prog, blendProg]) {
    const loc = gl.getAttribLocation(p, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  }

  camTex = makeTexture();
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  const halfFloat = gl.getExtension("OES_texture_half_float");
  gl.getExtension("OES_texture_half_float_linear");
  accumType = halfFloat ? halfFloat.HALF_FLOAT_OES : gl.UNSIGNED_BYTE;

  uLmsGains = gl.getUniformLocation(prog, "lmsGains");
  uWaterDir = gl.getUniformLocation(prog, "waterDir");
  uExposure = gl.getUniformLocation(prog, "exposure");
  uSaturation = gl.getUniformLocation(prog, "saturation");
  uBypass = gl.getUniformLocation(prog, "bypass");
  uFluor = gl.getUniformLocation(prog, "fluorKeep");
  uTint = gl.getUniformLocation(prog, "tint");
  uZoom = gl.getUniformLocation(prog, "zoom");
  uClarity = gl.getUniformLocation(prog, "clarity");
  uTexel = gl.getUniformLocation(prog, "texel");
  uTex = gl.getUniformLocation(prog, "tex");
  uAlpha = gl.getUniformLocation(blendProg, "alpha");
  uCam = gl.getUniformLocation(blendProg, "cam");
  uPrev = gl.getUniformLocation(blendProg, "prev");
  uShift = gl.getUniformLocation(blendProg, "shift");
}

function setupAccum(w, h) {
  for (const t of pingPong) {
    if (t) { gl.deleteFramebuffer(t.fbo); gl.deleteTexture(t.tex); }
  }
  pingPong = [makeAccumTarget(w, h), makeAccumTarget(w, h)];
  if (!pingPong[0] || !pingPong[1]) {
    // Half-float rendering unsupported — retry with plain bytes.
    accumType = gl.UNSIGNED_BYTE;
    pingPong = [makeAccumTarget(w, h), makeAccumTarget(w, h)];
  }
  firstFrame = true;
}

function setUniforms() {
  // Manual sliders multiply on top of tap/preset white balance.
  // Tint: green (+) <-> magenta (-), the WB axis orthogonal to temperature.
  const gm = Math.pow(2, $("tintGM").value / 200); // ±0.5 stop of green
  const manual = [$("red").value / 100, gm, $("blue").value / 100];
  const t = $("strength").value / 100;
  const g = wbGains.map((v, i) => 1 + (v * manual[i] - 1) * t);
  // Bradford: the gains describe "scale the cast to neutral" in RGB; the
  // equivalent LMS gains are cone responses of target white over cast.
  const cast = mulM(RGB2LMS, [1 / g[0], 1 / g[1], 1 / g[2]]);
  const white = mulM(RGB2LMS, [1, 1, 1]);
  gl.uniform3f(uLmsGains, white[0] / cast[0], white[1] / cast[1], white[2] / cast[2]);
  // Water-cast direction for fluorescence protection (unit vector).
  const w = [1 / g[0], 1 / g[1], 1 / g[2]];
  const wl = Math.hypot(...w);
  gl.uniform3f(uWaterDir, w[0] / wl, w[1] / wl, w[2] / wl);
  gl.uniform1f(uClarity, $("clarity").value / 100);
  gl.uniform2f(uTexel, 1 / cv.width, 1 / cv.height);
  // Tone: target white point from neutral (0) to deep actinic blue (100).
  // Mid-range ≈ cool T5 blue-white. Luma-normalized so brightness holds.
  // Green must fall much slower than red or the path detours through
  // magenta/purple; real blue tank light is cyan-leaning.
  const k = $("tone").value / 100;
  let tint = [1 - 0.35 * k, 1 - 0.04 * k, 1 + 0.9 * k * k];
  const luma = 0.2126 * tint[0] + 0.7152 * tint[1] + 0.0722 * tint[2];
  tint = tint.map(v => v / luma);
  gl.uniform3f(uTint, tint[0], tint[1], tint[2]);
  gl.uniform1f(uExposure, Math.pow(2, $("exposure").value / 50));
  gl.uniform1f(uFluor, $("fluor").value / 100);
  gl.uniform1f(uZoom, digitalZoom);
  gl.uniform1f(uSaturation, $("saturation").value / 100);
  gl.uniform1f(uBypass, comparing ? 1 : 0);
}

function draw() {
  if (video.readyState < 2) return;
  if (cv.width !== video.videoWidth) {
    cv.width = video.videoWidth;
    cv.height = video.videoHeight;
    setupAccum(cv.width, cv.height);
    updateRes(currentZoom());
  }

  // Upload the camera frame.
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, camTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

  // Pass 1: blend camera into the running average (ping -> pong).
  // Denoise slider maps to blend alpha: 0 -> alpha 1 (no averaging),
  // 100 -> alpha 1/16 (~16-frame average). First frame seeds the buffer.
  const denoise = $("denoise").value / 100;
  let alpha = firstFrame ? 1.0 : 1.0 / (1.0 + denoise * 15.0);
  firstFrame = false;

  // Align the running average to the new frame (handheld drift compensation).
  // Estimated on a small luma thumbnail; null means motion too large to track,
  // so restart the average rather than smear.
  let shiftX = 0, shiftY = 0;
  if (denoise > 0) {
    const sh = estimateShift();
    if (sh) {
      shiftX = sh[0] / MW;
      shiftY = -sh[1] / MH; // texture y is flipped relative to video
    } else if (prevLuma) {
      alpha = 1.0; // untrackable motion: reseed the average with this frame
    }
  }

  const src = pingPong[pp], dst = pingPong[1 - pp];
  pp = 1 - pp;
  gl.useProgram(blendProg);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform1f(uAlpha, alpha);
  gl.uniform2f(uShift, shiftX, shiftY);
  gl.uniform1i(uCam, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(uPrev, 1);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // Pass 2: color-correct the averaged frame to the screen.
  gl.useProgram(prog);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, dst.tex);
  gl.uniform1i(uTex, 0);
  setUniforms();
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// Redraw only when the camera delivers a new frame (~30fps) instead of on
// every display refresh (up to 120Hz) — much less GPU work and heat.
function startLoop() {
  if ("requestVideoFrameCallback" in video) {
    const tick = () => { draw(); video.requestVideoFrameCallback(tick); };
    video.requestVideoFrameCallback(tick);
  } else {
    let lastTime = -1;
    const tick = () => {
      if (video.currentTime !== lastTime) { lastTime = video.currentTime; draw(); }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
}

// --- pinch zoom + tap to white-balance --------------------------------------
// One pointer = tap-WB (on release, if it never became a pinch).
// Two pointers = pinch zoom: native camera zoom when the browser exposes it,
// shader (digital) zoom otherwise.
const pointers = new Map();
let pinchStartDist = 0, pinchStartZoom = 1, wasPinch = false;
let downX = 0, downY = 0; // to distinguish a tap from a drag

function currentZoom() {
  return camZoomCaps ? (camTrack.getSettings().zoom || 1) : digitalZoom;
}
function setZoom(z) {
  if (camZoomCaps) {
    z = Math.min(camZoomCaps.max, Math.max(camZoomCaps.min, z));
    camTrack.applyConstraints({ advanced: [{ zoom: z }] }).catch(() => {});
  } else {
    z = digitalZoom = Math.min(8, Math.max(1, z));
  }
  updateRes(z);
}
function updateRes(z) {
  const zoomTxt = z && z > 1.01 ? "  " + z.toFixed(1) + "×" : "";
  $("res").textContent = cv.width + "×" + cv.height + zoomTxt;
}

cv.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, e);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStartDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    pinchStartZoom = currentZoom();
    wasPinch = true;
  } else if (pointers.size === 1) {
    wasPinch = false;
    downX = e.clientX; downY = e.clientY;
  }
});
cv.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);
  if (pointers.size === 2 && pinchStartDist > 0) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    setZoom(pinchStartZoom * d / pinchStartDist);
  }
});
const endPointer = e => { pointers.delete(e.pointerId); };
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("pointerup", e => {
  endPointer(e);
  // Only a genuine tap (no pinch, minimal movement) sets white balance.
  if (!wasPinch && Math.hypot(e.clientX - downX, e.clientY - downY) < 12) tapWB(e);
});

function tapWB(e) {
  if (video.readyState < 2) return;
  const r = cv.getBoundingClientRect();
  // Map through digital zoom: the visible frame is a center crop of the video.
  let u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
  u = (u - 0.5) / digitalZoom + 0.5;
  v = (v - 0.5) / digitalZoom + 0.5;
  const x = Math.round(u * video.videoWidth);
  const y = Math.round(v * video.videoHeight);

  // Average a small patch of the *raw* video around the tap point.
  const N = 12;
  sampleCv.width = sampleCv.height = N;
  sampleCtx.drawImage(video, x - N / 2, y - N / 2, N, N, 0, 0, N, N);
  const d = sampleCtx.getImageData(0, 0, N, N).data;
  let rs = 0, gs = 0, bs = 0;
  for (let i = 0; i < d.length; i += 4) {
    rs += Math.pow(d[i] / 255, 2.2);
    gs += Math.pow(d[i + 1] / 255, 2.2);
    bs += Math.pow(d[i + 2] / 255, 2.2);
  }
  const n = d.length / 4;
  rs /= n; gs /= n; bs /= n;
  if (gs < 0.002) return; // too dark to trust

  // Gains that make the patch neutral, normalized to green.
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  wbGains = [clamp(gs / Math.max(rs, 1e-4), 0.25, 12), 1, clamp(gs / Math.max(bs, 1e-4), 0.25, 12)];
  $("hint").style.opacity = 0;
}

// --- controls ---------------------------------------------------------------
// --- advanced camera controls ------------------------------------------------
// Enumerate everything getCapabilities() reports and build a control per
// feature: range -> slider, enum -> dropdown, boolean -> toggle. Whatever
// this WebKit exposes shows up automatically.
const CAM_SKIP = new Set(["width", "height", "aspectRatio", "frameRate",
  "facingMode", "deviceId", "groupId", "resizeMode", "zoom"]);

function buildCamControls(track) {
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  const settings = track.getSettings ? track.getSettings() : {};
  const box = $("camCtl");
  box.innerHTML = "";
  let count = 0;

  const apply = (name, value) => {
    track.applyConstraints({ advanced: [{ [name]: value }] }).catch(() => {});
  };

  for (const [name, cap] of Object.entries(caps)) {
    if (CAM_SKIP.has(name)) continue;
    const row = document.createElement("div");
    row.className = "row";
    const label = document.createElement("label");
    label.textContent = name.replace(/([A-Z])/g, " $1").toLowerCase();
    row.appendChild(label);

    if (cap === true || (Array.isArray(cap) && cap.every(v => typeof v === "boolean"))) {
      // boolean (e.g. torch) — must be checked before enum: it's often [false, true]
      const btn = document.createElement("button");
      let on = !!settings[name];
      btn.textContent = on ? "on" : "off";
      btn.onclick = () => { on = !on; btn.textContent = on ? "on" : "off"; apply(name, on); };
      row.appendChild(btn);
    } else if (Array.isArray(cap) && cap.length > 1) {    // enum (e.g. whiteBalanceMode)
      const sel = document.createElement("select");
      for (const v of cap) {
        const o = document.createElement("option");
        o.value = o.textContent = v;
        if (settings[name] === v) o.selected = true;
        sel.appendChild(o);
      }
      sel.onchange = () => apply(name, sel.value);
      row.appendChild(sel);
    } else if (cap && typeof cap === "object" && "min" in cap && cap.max > cap.min) {  // range
      const inp = document.createElement("input");
      inp.type = "range";
      inp.min = cap.min; inp.max = cap.max;
      inp.step = cap.step || (cap.max - cap.min) / 100;
      inp.value = settings[name] ?? (cap.min + cap.max) / 2;
      inp.oninput = () => apply(name, parseFloat(inp.value));
      row.appendChild(inp);
    } else {
      continue;
    }
    box.appendChild(row);
    count++;
  }

  if (count > 0) $("camBtn").hidden = false;
}

// Shelves: 🎚 sliders, 📷 camera, ✨ presets, ⋯ more. One open at a time.
const SHELVES = [["tune", "sliders"], ["camBtn", "camCtl"], ["presetBtn", "presets"], ["moreBtn", "more"]];
$("sliders").classList.add("collapsed");
for (const [btnId, boxId] of SHELVES) {
  $(btnId).onclick = () => {
    const open = !$(boxId).classList.toggle("collapsed");
    $(btnId).classList.toggle("active", open);
    if (open) for (const [b, x] of SHELVES) {
      if (b !== btnId) { $(x).classList.add("collapsed"); $(b).classList.remove("active"); }
    }
  };
}

// Presets are named for the LIGHTING YOU'RE LOOKING AT; each applies the
// correction that makes the photo match what your adapted eye sees under it.
// Bluer light -> stronger correction, but keep some blue mood (the eye never
// fully adapts) and protect fluorescence, which the eye sees vividly.
// [wbGains, tone, fluor, saturation, clarity]
const PRESETS = {
  windex:  [[3.2, 1.0, 0.45], 45, 85, 105, 20],  // heavy blue: strong fix, keep glow
  actinic: [[2.2, 1.0, 0.60], 55, 90, 110, 15],  // fluorescence is the subject
  mixed:   [[2.4, 1.0, 0.60], 35, 55, 105, 25],  // your tank: T5-ish middle ground
  white:   [[1.5, 1.0, 0.85], 15, 30, 100, 30],  // near-daylight: gentle nudge
};
for (const btn of document.querySelectorAll("#presets button[data-preset]")) {
  btn.onclick = () => {
    const [g, tone, fluor, sat, clar] = PRESETS[btn.dataset.preset];
    wbGains = g.slice();
    $("tone").value = tone; $("fluor").value = fluor; $("saturation").value = sat;
    $("clarity").value = clar;
    $("red").value = 100; $("blue").value = 100; $("tintGM").value = 0; $("strength").value = 100;
    $("hint").style.opacity = 0;
  };
}

$("reset").onclick = () => {
  wbGains = [1, 1, 1];
  $("red").value = 100; $("blue").value = 100; $("tintGM").value = 0;
  $("denoise").value = 60; $("fluor").value = 50;
  $("tone").value = 35; $("clarity").value = 25;
  $("strength").value = 100; $("exposure").value = 0; $("saturation").value = 100;
  $("hint").style.opacity = 1;
};
const cmp = $("compare");
const cmpOn = e => { e.preventDefault(); comparing = true; };
const cmpOff = () => { comparing = false; };
cmp.addEventListener("pointerdown", cmpOn);
cmp.addEventListener("pointerup", cmpOff);
cmp.addEventListener("pointercancel", cmpOff);
cmp.addEventListener("pointerleave", cmpOff);

$("shutter").onclick = async () => {
  const flash = $("flash");
  flash.style.opacity = 0.8;
  setTimeout(() => flash.style.opacity = 0, 120);
  // Without preserveDrawingBuffer the GL buffer is cleared after compositing,
  // so redraw immediately before reading the canvas.
  draw();
  const blob = await new Promise(res => cv.toBlob(res, "image/jpeg", 0.92));
  if (!blob) return;
  const file = new File([blob], "aqua-" + new Date().toISOString().replace(/[:.]/g, "-") + ".jpg",
                        { type: "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { /* user cancelled */ }
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = file.name;
    a.click();
    URL.revokeObjectURL(a.href);
  }
};

// --- startup ----------------------------------------------------------------
$("startBtn").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment",
        width: { ideal: 1920 },
        height: { ideal: 1080 },
      },
      audio: false,
    });
    video.srcObject = stream;
    const track = stream.getVideoTracks()[0];
    camTrack = track;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.zoom && caps.zoom.max > caps.zoom.min) camZoomCaps = caps.zoom;
    // Lock ISP white balance if we can: our correction is calibrated against
    // the frames as delivered, so continuous WB re-guessing under it makes
    // tap-WB go stale. Let auto WB settle briefly, then freeze it.
    if (Array.isArray(caps.whiteBalanceMode) && caps.whiteBalanceMode.includes("manual")) {
      setTimeout(() => {
        track.applyConstraints({ advanced: [{ whiteBalanceMode: "manual" }] })
          .then(() => buildCamControls(track))
          .catch(() => {});
      }, 1500);
    }
    buildCamControls(track);
    await video.play();
    // Wait until real frame dimensions are known before first draw.
    if (!video.videoWidth) {
      await new Promise(res => video.addEventListener("loadedmetadata", res, { once: true }));
    }
    initGL();
    $("start").hidden = true;
    $("panel").hidden = false;
    startLoop();
  } catch (e) {
    $("err").textContent = e.name === "NotAllowedError"
      ? "Camera permission denied. Enable it in Settings → Safari → Camera."
      : "Camera error: " + e.message;
  }
};
</script>
</body>
</html>
